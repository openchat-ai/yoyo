[workspace]
resolver = "2"
members = ["verifier", "libyoyo", "verifier/isa-proc", "platform", "yoyo-runtime"]
default-members = ["verifier", "libyoyo"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["YOYO maintainers"]

[workspace.dependencies]
isa-proc = { path = "verifier/isa-proc" }
libyoyo = { path = "libyoyo" }
yoyo-platform = { path = "platform" }

# Stage 10-A: size-optimize the embedded selfhost runtime DLL only.
[profile.release.package.yoyo-runtime]
opt-level = "z"
codegen-units = 1
