[workspace]
resolver = "2"
members = ["verifier", "libyoyo", "verifier/isa-proc", "platform", "yoyo-runtime"]
default-members = ["verifier", "libyoyo"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["YOYO maintainers"]

[workspace.dependencies]
isa-proc = { path = "verifier/isa-proc" }
libyoyo = { path = "libyoyo" }
yoyo-platform = { path = "platform" }

# Stage 10-A: size-optimize the embedded selfhost runtime DLL only.
[profile.release.package.yoyo-runtime]
opt-level = "z"
codegen-units = 1

# Stage 11-A: dedicated profile for yoyo-runtime cdylib — fat LTO + strip +
# abort without forcing LTO on the verifier CLI (wasmtime link). Output:
#   target/release-runtime/yoyo_runtime.dll
# Prefer this path in win32_selfhost / linux_selfhost; scripts copy into
# target/release/ for stage10 compatibility.
[profile.release-runtime]
inherits = "release"
lto = true
strip = "symbols"
codegen-units = 1
opt-level = "z"
panic = "abort"
rustflags = ["-C", "target-feature=+crt-static"]
