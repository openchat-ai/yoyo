[package]
name = "verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YOYO verifier + linker (Rust DDC peer)"
default-run = "yoyo"

[[bin]]
name = "yoyo"
path = "src/main.rs"

[[bin]]
name = "yoyo-sh"
path = "src/bin/yoyo-sh.rs"

[[bin]]
name = "emit-rt-sidecar"
path = "src/bin/emit-rt-sidecar.rs"

[lib]
name = "verifier"
path = "src/lib.rs"

[features]
default = ["full-backends", "wasm-runtime"]
# All 37 emit backends (yoyo CLI / DDC peers). Off for yoyo-runtime cdylib.
full-backends = []
# wasmtime instantiate path (yoyo CLI only; not needed in embedded runtime DLL).
wasm-runtime = ["dep:wasmtime"]

[dependencies]
isa-proc = { workspace = true }
libyoyo = { workspace = true }
yoyo-platform = { workspace = true }
sha2 = "0.10"
hex = "0.4"
wasmtime = { version = "40", features = ["cranelift"], optional = true }
