[package]
name = "verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YOYO verifier + linker (Rust DDC peer)"
default-run = "yoyo"

[[bin]]
name = "yoyo"
path = "src/main.rs"

[[bin]]
name = "yoyo-sh"
path = "src/bin/yoyo-sh.rs"

[lib]
name = "verifier"
path = "src/lib.rs"

[dependencies]
isa-proc = { workspace = true }
libyoyo = { workspace = true }
yoyo-platform = { workspace = true }
sha2 = "0.10"
hex = "0.4"
wasmtime = { version = "40", features = ["cranelift"] }
