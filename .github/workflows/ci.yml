name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      h00_bisect:
        description: "Enable Stage17 H00 multi-phase bisect (expensive; 150–165 rebuilds). Default off — use for debug only."
        type: boolean
        default: false

# One active run per workflow+ref; newer pushes cancel older Stage17 thrash.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Win32 H_00 seed/link uses cwd sidecar yoyo_rt.dll (LoadLibrary); gen2rt --selfhost still embeds.
    # Linux runners have no Win DLL — keep windows-latest for gen12/fullbody.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Default rustflags is "-D warnings". Multi-ISA backend stubs intentionally
      # keep unused helpers; hygiene is local/clippy. Trust gates are golden/DDC/lock below.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # crt-static sidecar MUST build before verifier — otherwise reused verifier rlibs
      # keep /MD and yoyo_runtime.dll still imports VCRUNTIME140 (manual-map PEB walk fails).
      - name: Build yoyo-runtime DLL
        working-directory: yoyo-rust
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --profile release-runtime -p yoyo-runtime

      - name: Build verifier
        working-directory: yoyo-rust/verifier
        run: cargo build

      - name: Unit tests
        working-directory: yoyo-rust/verifier
        run: cargo test -- --test-threads=1

      - name: Golden tests
        working-directory: yoyo-rust/verifier
        run: cargo run -- test golden

      - name: Backend smoke tests
        working-directory: yoyo-rust/verifier
        run: cargo run -- test backends

      - name: DDC validation
        working-directory: yoyo-rust/verifier
        run: cargo run -- test ddc

      - name: GEN12 gen1≡gen2 (.ty==.tyb DDC)
        working-directory: yoyo-rust/verifier
        run: cargo run -- test gen12

      - name: Lock pin monitor (yoyo.ty vs yoyo.ty.lock)
        working-directory: yoyo-rust/verifier
        run: cargo run -- test lock

      - name: YOYO info
        working-directory: yoyo-rust/verifier
        run: cargo run -- info

      # Default: smoke once. Multi-phase H00 bisect is opt-in only (H00_BISECT=1 /
      # workflow_dispatch input h00_bisect=true). Do NOT enable on routine PR pushes.
      - name: Stage 17 OW-IAT wire-up (manual-map H_00 + cwd sidecar smoke)
        shell: pwsh
        env:
          H00_BISECT: ${{ github.event.inputs.h00_bisect == 'true' && '1' || '' }}
        run: pwsh -NoProfile -File scripts/stage17-ow-iat-wireup.ps1

  linux-m4:
    # Post-v1.0 OW-RT Linux sidecar + OW-IAT no-dlsym tramp — prevent Windows-only CI regressions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build release verifier + runtime
        working-directory: yoyo-rust
        run: |
          bash ../scripts/build-linux-h00-tramp.sh
          # Bust stale sccache artifacts; tramp include_bytes must match sidecar build.
          cargo clean -p verifier -p yoyo-runtime
          cargo build --release -p verifier
          cargo build --profile release-runtime -p yoyo-runtime
          echo "tramp bytes: $(stat -c%s verifier/blobs/linux_h00_tramp.elf)"
          echo "sidecar bytes: $(stat -c%s target/release-runtime/libyoyo_runtime.so)"

      - name: Stage 10-B Linux pure M4 (H_00 sidecar + no-dlsym tramp)
        run: bash scripts/stage10-linux-pure-m4.sh

      - name: Stage 17 OW-IAT spike (pe_manual_map unit tests)
        run: bash scripts/stage17-ow-iat-spike.sh
