name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # Win32 H_00 seed/link (gen12) embeds yoyo_runtime.dll; Linux runners have no DLL.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Default rustflags is "-D warnings". Multi-ISA backend stubs intentionally
      # keep unused helpers; hygiene is local/clippy. Trust gates are golden/DDC/lock below.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build verifier
        working-directory: yoyo-rust/verifier
        run: cargo build

      # Needed for link_pe_win32 H_00 path (gen12 / seed host). Debug DLL is enough to link.
      - name: Build yoyo-runtime DLL
        working-directory: yoyo-rust
        run: cargo build -p yoyo-runtime

      - name: Unit tests
        working-directory: yoyo-rust/verifier
        run: cargo test

      - name: Golden tests
        working-directory: yoyo-rust/verifier
        run: cargo run -- test golden

      - name: Backend smoke tests
        working-directory: yoyo-rust/verifier
        run: cargo run -- test backends

      - name: DDC validation
        working-directory: yoyo-rust/verifier
        run: cargo run -- test ddc

      - name: GEN12 gen1≡gen2 (.ty==.tyb DDC)
        working-directory: yoyo-rust/verifier
        run: cargo run -- test gen12

      - name: Lock pin monitor (yoyo.ty vs yoyo.ty.lock)
        working-directory: yoyo-rust/verifier
        run: cargo run -- test lock

      - name: YOYO info
        working-directory: yoyo-rust/verifier
        run: cargo run -- info
