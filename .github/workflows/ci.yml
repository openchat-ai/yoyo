name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        working-directory: yoyo-rust/verifier
        run: cargo build

      - name: Unit tests
        working-directory: yoyo-rust/verifier
        run: cargo test

      - name: Golden tests
        working-directory: yoyo-rust/verifier
        run: cargo run -- test golden

      - name: Backend smoke tests
        working-directory: yoyo-rust/verifier
        run: cargo run -- test backends

      - name: DDC validation
        working-directory: yoyo-rust/verifier
        run: cargo run -- test ddc

      - name: GEN12 gen1≡gen2 (.ty==.tyb DDC)
        working-directory: yoyo-rust/verifier
        run: cargo run -- test gen12

      - name: YOYO info
        working-directory: yoyo-rust/verifier
        run: cargo run -- info